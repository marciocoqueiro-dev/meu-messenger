<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rede Coqueiro - Messenger</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Tela de Login -->
    <div id="telaLogin" class="tela-login">
        <h2>Login</h2>
        <form id="formLogin" onsubmit="return validarLogin()">
            <div class="campo">
                <label for="nickLogin">Nick:</label>
                <input type="text" id="nickLogin" name="nick" required />
            </div>

            <div class="campo">
                <label for="senhaLogin">Senha:</label>
                <input type="password" id="senhaLogin" name="senha" required />
            </div>

            <button type="submit">Entrar</button>
        </form>

        <div class="alternar">
            <p>Não tem uma conta? <a href="#" onclick="mostrarCadastro()">Cadastre-se</a></p>
        </div>
    </div>

    <!-- Tela de Cadastro -->
    <div id="telaCadastro" class="tela-cadastro" style="display:none;">
        <h2>Cadastro</h2>
        <form id="formCadastro" onsubmit="return validarCadastro()">
            <div class="campo">
                <label for="nickCadastro">Nick:</label>
                <input type="text" id="nickCadastro" name="nick" required />
            </div>

            <div class="campo">
                <label for="senhaCadastro">Senha:</label>
                <input type="password" id="senhaCadastro" name="senha" required />
            </div>

            <div class="campo">
                <label for="confirmarSenhaCadastro">Confirmar Senha:</label>
                <input type="password" id="confirmarSenhaCadastro" name="confirmarSenha" required />
            </div>

            <button type="submit">Cadastrar</button>
        </form>

        <div class="alternar">
            <p>Já tem uma conta? <a href="#" onclick="mostrarLogin()">Fazer Login</a></p>
        </div>
    </div>

    <!-- Seção Ocioso (Sem o Jogo) -->
    <div id="ocioso">
        <h3>Ocioso</h3>
        <p>Você não está jogando no momento.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
